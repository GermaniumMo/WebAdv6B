<body>
    <h1>The <code>for</code> loop</h1>
    <p><code>For (statement1 ; statment2 ; statment3) {...}</code></p>
    <ul>
        <li><b>Statment1</b> - runs once before the loop starts &nbsp;(<code>i = 0</code>)</li>
        <li><b>statement2</b> - the condition, checked before every pass &nbsp;(<code>i &lt; 5</code>)</li>
        <li><b>statement3</b> - runs after every pass &nbsp;(<code>i++</code>)</li>
    </ul>

    <p>Result:</p>
    <p id="demo"></p>

</body>
